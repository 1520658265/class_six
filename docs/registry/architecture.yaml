# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: stat_changed_broadcast
    status: active
    pattern: signal
    producer: stat-system
    consumers:
      - stat-panel-ui
      - combat-core
      - emotion-state
    adr: docs/architecture/adr-0001-stat-system-contract.md
    signal_signature: "stat_changed(stat_id: String, old_value: int, new_value: int, requested_delta: int)"
    notes: "4 元组 payload：old/new 让订阅者计算 effective_delta = new - old；requested 保留调用方原始意图，UI 在 effective ≠ requested 时降级显示。底/顶完全吞掉时不广播。订阅必须用 Object.CONNECT_DEFERRED"
    referenced_by:
      - docs/architecture/adr-0001-stat-system-contract.md
    added: 2026-05-31
    revised: ""

  - contract: var_changed_broadcast
    status: active
    pattern: signal
    producer: stat-system
    consumers:
      - emotion-state
      - combat-core
    adr: docs/architecture/adr-0001-stat-system-contract.md
    signal_signature: "var_changed(var_id: String, old_value: int, new_value: int, requested_delta: int)"
    notes: "隐性变量变化广播。UI 不订阅（设计上不可见）。订阅必须用 CONNECT_DEFERRED"
    referenced_by:
      - docs/architecture/adr-0001-stat-system-contract.md
    added: 2026-05-31
    revised: ""

  - contract: affinity_changed_broadcast
    status: active
    pattern: signal
    producer: stat-system
    consumers:
      - npc-system
    adr: docs/architecture/adr-0001-stat-system-contract.md
    signal_signature: "affinity_changed(npc_id: String, old_value: int, new_value: int, requested_delta: int)"
    notes: "好感度变化广播，per-NPC clamp。订阅必须用 CONNECT_DEFERRED"
    referenced_by:
      - docs/architecture/adr-0001-stat-system-contract.md
    added: 2026-05-31
    revised: ""

  - contract: event_triggered_broadcast
    status: active
    pattern: signal
    producer: stat-system
    consumers:
      - cutscene-runner
      - event-flow
    adr: docs/architecture/adr-0001-stat-system-contract.md
    signal_signature: "event_triggered(event_id: String)"
    notes: "事件首次 mark 时广播；重复 mark 静默忽略"
    referenced_by:
      - docs/architecture/adr-0001-stat-system-contract.md
    added: 2026-05-31
    revised: ""

  - contract: era_marker_added_broadcast
    status: active
    pattern: signal
    producer: stat-system
    consumers:
      - chapter-title
      - era-marker
    adr: docs/architecture/adr-0001-stat-system-contract.md
    signal_signature: "era_marker_added(marker_id: String)"
    notes: "时代切片首次点亮时广播 toast 触发"
    referenced_by:
      - docs/architecture/adr-0001-stat-system-contract.md
    added: 2026-05-31
    revised: ""

  - contract: chapter_changed_broadcast
    status: active
    pattern: signal
    producer: stat-system
    consumers:
      - chapter-title
      - ui-root
      - era-marker
    adr: docs/architecture/adr-0001-stat-system-contract.md
    signal_signature: "chapter_changed(old_chapter: String, new_chapter: String)"
    notes: "2 元组 payload，与 stat/var/affinity 信号在 old/new 字段上对称。from_dict 路径不发该信号。订阅必须用 CONNECT_DEFERRED"
    referenced_by:
      - docs/architecture/adr-0001-stat-system-contract.md
    added: 2026-05-31
    revised: ""

  - contract: state_serialization
    status: active
    pattern: direct_call
    producer: stat-system
    consumers:
      - save-load
    adr: docs/architecture/adr-0001-stat-system-contract.md
    signal_signature: "GlobalState.to_dict() -> Dictionary; GlobalState.from_dict(data: Dictionary) -> void; GlobalState.reset_to_initial() -> void"
    notes: "to_dict 内部对 _triggered/_era_markers keys 排序，保证字面级稳定；from_dict 自愈式（cast int + clampi + push_warning），不广播 *_changed 信号；UI 在 SaveManager.load_finished 后主动 re-read"
    referenced_by:
      - docs/architecture/adr-0001-stat-system-contract.md
    added: 2026-05-31
    revised: ""

