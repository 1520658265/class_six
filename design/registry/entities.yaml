# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.

formulas:
  - name: stat_clamp
    status: active
    source: design/gdd/stat-system.md
    referenced_by:
      - design/gdd/stat-system.md
    variables:
      - current_value
      - delta
      - min
      - max
    output_range: [0, 20]   # union of all stat & var ranges (显性 0–10, xinjie/qianbao 0–20)
    expression: "clamp(current_value + delta, min, max)"
    notes: "Used for both _stats (4 显性, 0–10) and _vars (3 隐性). _chapter and _triggered/_era_markers do NOT use this formula. Output = new_value, written back to dict."
    added: 2026-05-31
    revised: ""

  - name: affinity_clamp
    status: active
    source: design/gdd/stat-system.md
    referenced_by:
      - design/gdd/stat-system.md
    variables:
      - current
      - delta
      - AFFINITY_MIN
      - AFFINITY_MAX
    output_range: [-10, 10]
    expression: "clamp(current + delta, AFFINITY_MIN, AFFINITY_MAX)"
    notes: "Same shape as stat_clamp but dedicated globals (-10 to +10). All 12 demo NPCs share the same min/max."
    added: 2026-05-31
    revised: ""

  - name: delta_broadcast_predicate
    status: active
    source: design/gdd/stat-system.md
    referenced_by:
      - design/gdd/stat-system.md
    variables:
      - current_value
      - new_value
    output_range: [0, 1]   # bool
    expression: "new_value != current_value"
    notes: "Decides whether stat_changed / var_changed / affinity_changed signals fire. Reset and from_dict paths bypass this predicate (always silent)."
    added: 2026-05-31
    revised: ""


