# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - target_fps: 60
    total_frame_budget_ms: 16.6
    platform: PC
    adr: docs/architecture/adr-0001-stat-system-contract.md
    notes: "源自 .claude/docs/technical-preferences.md → Performance Budgets。后续 ADR 在不超过 16.6ms 的前提下分配各系统预算"
    added: 2026-05-31
    revised: ""

  - system: stat-system
    status: active
    budget_ms: 0.05
    adr: docs/architecture/adr-0001-stat-system-contract.md
    notes: "100 次 change_stat + 1 mock subscriber 单次 < 5ms（headless release，重复 3 次取最差，H.12 AC）；摊到每帧远 < 0.05ms。Foundation 层零热路径"
    referenced_by:
      - docs/architecture/adr-0001-stat-system-contract.md
    added: 2026-05-31
    revised: ""

