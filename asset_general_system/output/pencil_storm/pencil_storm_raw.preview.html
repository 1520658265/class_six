<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Pencil Storm</title>
<style>
  :root {
    --bg: #1a1a1a;
    --panel: #262630;
    --border: #3a3a45;
    --text: #eee;
    --accent: #4af;
    --accent-hover: #6cf;
    --ok: #6f9;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px;
  }
  h1 { color: var(--accent); margin: 0 0 8px 0; }
  .subtitle { color: #888; margin-bottom: 20px; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 20px;
  }
  .stage {
    background:
      linear-gradient(180deg, #1a2a4a 0%, #2a3a5a 60%, #4a3a2a 60%, #2a1a0a 100%);
    border: 1px solid var(--border);
    border-radius: 8px;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    position: relative;
  }
  .stage::before {
    content: '';
    position: absolute;
    left: 50%;
    bottom: 12%;
    width: 24px;
    height: 64px;
    background: #c2a878;
    border-radius: 4px 4px 0 0;
    transform: translateX(-50%);
    box-shadow: 0 4px 0 #8a7048;
  }
  .vfx {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    opacity: 0;
    will-change: transform, opacity;
  }
  .controls {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    height: fit-content;
  }
  h3 {
    margin: 0 0 12px 0;
    color: var(--ok);
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .preset-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
  .play-btn {
    width: 100%;
    background: var(--ok);
    color: #000;
    border: none;
    padding: 12px;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .play-btn:hover { background: #8fc; color: #000; }
  label { font-size: 12px; color: #aaa; display: block; margin: 12px 0 4px; }
  input[type=range] { width: 100%; }
  .value { float: right; color: var(--accent); }
  .code-block {
    background: #0a0a0e;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    font-family: 'Cascadia Code', Consolas, monospace;
    font-size: 11px;
    line-height: 1.5;
    color: #ddd;
    white-space: pre;
    overflow-x: auto;
    margin-top: 8px;
  }
  .code-keyword { color: #c79; }
  .code-string { color: #9c6; }
  .code-comment { color: #666; font-style: italic; }
  .info { font-size: 12px; color: #888; line-height: 1.6; margin-top: 12px; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--accent); font-size: 13px; }
  .raw-preview {
    margin-top: 20px;
    padding: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .raw-preview img {
    max-width: 100%;
    image-rendering: auto;
    border: 1px solid var(--border);
    border-radius: 4px;
    background:
      repeating-conic-gradient(#333 0% 25%, #444 0% 50%) 0 0 / 24px 24px;
  }
  kbd {
    background: #333;
    border: 1px solid #555;
    border-radius: 3px;
    padding: 1px 6px;
    font-family: monospace;
    font-size: 11px;
  }
</style>
</head>
<body>
  <h1>Pencil Storm</h1>
  <p class="subtitle">单图 VFX · 用 transform 动画演示，把这张图当贴图丢进 Godot 用 Tween 一样的逻辑</p>

  <div class="grid">
    <div class="stage" id="stage">
      <img class="vfx" id="vfx" src="pencil_storm_raw.png" alt="vfx">
    </div>

    <div class="controls">
      <button class="play-btn" id="play">▶ 播放动画 (空格)</button>

      <h3>动画方案</h3>
      <div class="preset-row">
        <button data-preset="diagonal" class="active">↙ 对角下砸</button>
        <button data-preset="fade">淡入淡出</button>
        <button data-preset="impact">缩放冲击</button>
        <button data-preset="combo">组合（推荐）</button>
      </div>

      <h3>参数微调</h3>
      <label>持续时间 <span class="value" id="dur-val">0.6s</span></label>
      <input type="range" id="duration" min="200" max="2000" value="600" step="50">

      <label>位移强度 <span class="value" id="off-val">200px</span></label>
      <input type="range" id="offset" min="0" max="600" value="200" step="20">

      <label>缩放峰值 <span class="value" id="scl-val">1.20</span></label>
      <input type="range" id="scale" min="80" max="180" value="120" step="5">

      <details open>
        <summary>查看 Godot 代码（基于当前参数）</summary>
        <div class="code-block" id="godot-code"></div>
      </details>

      <div class="info">
        快捷键：<kbd>Space</kbd> 播放 ·
        <kbd>1-4</kbd> 切换方案
      </div>
    </div>
  </div>

  <div class="raw-preview">
    <h3>原始素材（2048×2048）</h3>
    <p style="color:#888;font-size:12px;margin:8px 0">
      含 alpha 通道，黑底已抠透明（棋盘格 = 透明区域）。
      可直接在 Godot 中作为 Sprite2D / Texture2D 使用。
    </p>
    <img src="pencil_storm_raw.png" alt="raw">
  </div>

<script>
const vfx = document.getElementById('vfx');
const playBtn = document.getElementById('play');
const codeBlock = document.getElementById('godot-code');

let preset = 'diagonal';
let duration = 600;
let offset = 200;
let scale = 1.2;
let isPlaying = false;

const presets = {
  diagonal: {
    name: '对角下砸',
    keyframes: () => [
      { opacity: 0, transform: 'translate(' + offset + 'px, ' + (-offset) + 'px) scale(1.1)' },
      { opacity: 1, transform: 'translate(0, 0) scale(1)', offset: 0.3 },
      { opacity: 0, transform: 'translate(' + (-offset * 0.3) + 'px, ' + (offset * 0.3) + 'px) scale(0.95)' },
    ],
  },
  fade: {
    name: '淡入淡出',
    keyframes: () => [
      { opacity: 0, transform: 'scale(1)' },
      { opacity: 1, transform: 'scale(1)', offset: 0.5 },
      { opacity: 0, transform: 'scale(1)' },
    ],
  },
  impact: {
    name: '缩放冲击',
    keyframes: () => [
      { opacity: 0, transform: 'scale(0.6)' },
      { opacity: 1, transform: 'scale(' + scale + ')', offset: 0.4 },
      { opacity: 0, transform: 'scale(' + (scale * 1.1) + ')' },
    ],
  },
  combo: {
    name: '组合（推荐）',
    keyframes: () => [
      { opacity: 0, transform: 'translate(' + (offset * 0.5) + 'px, ' + (-offset * 0.5) + 'px) scale(0.8)' },
      { opacity: 1, transform: 'translate(0, 0) scale(1)', offset: 0.25 },
      { opacity: 1, transform: 'translate(' + (-offset * 0.2) + 'px, ' + (offset * 0.2) + 'px) scale(1.05)', offset: 0.7 },
      { opacity: 0, transform: 'translate(' + (-offset * 0.5) + 'px, ' + (offset * 0.5) + 'px) scale(1.1)' },
    ],
  },
};

function godotCode(name) {
  const durIn = (duration * 0.3 / 1000).toFixed(2);
  const durOut = (duration * 0.4 / 1000).toFixed(2);
  const durHold = (duration * 0.45 / 1000).toFixed(2);
  const half = (duration / 2000).toFixed(2);
  const off3 = Math.round(offset * 0.3);
  const offHalf = Math.round(offset * 0.5);
  const offSmall = Math.round(offset * 0.2);
  const scl = scale.toFixed(2);

  if (name === 'diagonal') {
    return [
      '# Godot 4 GDScript - 对角下砸',
      'func play_pencil_storm() -> void:',
      '    var s := $VFXLayer/PencilStorm',
      '    s.modulate.a = 0.0',
      '    s.position = Vector2(' + offset + ', -' + offset + ')',
      '    s.scale = Vector2(1.1, 1.1)',
      '',
      '    var tw := create_tween().set_parallel()',
      '    tw.tween_property(s, "modulate:a", 1.0, ' + durIn + ')',
      '    tw.tween_property(s, "position", Vector2.ZERO, ' + durIn + ') \\',
      '      .set_trans(Tween.TRANS_CUBIC)',
      '    tw.chain().tween_property(s, "modulate:a", 0.0, ' + durOut + ')',
      '    tw.tween_property(s, "position",',
      '      Vector2(-' + off3 + ', ' + off3 + '), ' + durOut + ')',
    ].join('\n');
  }
  if (name === 'fade') {
    return [
      '# Godot 4 GDScript - 淡入淡出',
      'var tw := create_tween()',
      'tw.tween_property(s, "modulate:a", 1.0, ' + half + ')',
      'tw.tween_property(s, "modulate:a", 0.0, ' + half + ')',
    ].join('\n');
  }
  if (name === 'impact') {
    return [
      '# Godot 4 GDScript - 缩放冲击 + 屏震',
      's.scale = Vector2(0.6, 0.6)',
      's.modulate.a = 0.0',
      'var tw := create_tween().set_parallel()',
      'tw.tween_property(s, "scale",',
      '  Vector2(' + scl + ', ' + scl + '), ' + durIn + ') \\',
      '  .set_trans(Tween.TRANS_BACK).set_ease(Tween.EASE_OUT)',
      'tw.tween_property(s, "modulate:a", 1.0, ' + durIn + ')',
      'tw.chain().tween_property(s, "modulate:a", 0.0, ' + durOut + ')',
      '',
      '# 屏幕震动',
      'camera.add_trauma(0.6)',
    ].join('\n');
  }
  // combo
  return [
    '# Godot 4 GDScript - 组合（推荐用于 baoxianjin 砸击）',
    'func play_pencil_storm() -> void:',
    '    var s := $VFXLayer/PencilStorm',
    '    s.modulate.a = 0.0',
    '    s.position = Vector2(' + offHalf + ', -' + offHalf + ')',
    '    s.scale = Vector2(0.8, 0.8)',
    '',
    '    var tw := create_tween().set_parallel()',
    '    # 1. 进入 (' + durIn + 's)',
    '    tw.tween_property(s, "modulate:a", 1.0, ' + durIn + ')',
    '    tw.tween_property(s, "position", Vector2.ZERO, ' + durIn + ') \\',
    '      .set_trans(Tween.TRANS_CUBIC).set_ease(Tween.EASE_OUT)',
    '    tw.tween_property(s, "scale", Vector2.ONE, ' + durIn + ')',
    '',
    '    # 2. 维持冲击感',
    '    tw.chain().tween_property(s, "scale",',
    '      Vector2(1.05, 1.05), ' + durHold + ')',
    '    tw.tween_property(s, "position",',
    '      Vector2(-' + offSmall + ', ' + offSmall + '), ' + durHold + ')',
    '',
    '    # 3. 淡出',
    '    tw.chain().tween_property(s, "modulate:a", 0.0, ' + durOut + ')',
    '    tw.tween_property(s, "position",',
    '      Vector2(-' + offHalf + ', ' + offHalf + '), ' + durOut + ')',
    '',
    '    # 屏震',
    '    var cam := get_viewport().get_camera_2d()',
    '    if cam and cam.has_method("add_trauma"):',
    '        cam.add_trauma(0.5)',
  ].join('\n');
}

function highlightCode(s) {
  return s
    .replace(/(#.*)/g, '<span class="code-comment">$1</span>')
    .replace(/\b(func|var|return|if|for|in|and|or)\b/g,
      '<span class="code-keyword">$1</span>')
    .replace(/("[^"]*")/g, '<span class="code-string">$1</span>');
}

function updateCode() {
  codeBlock.innerHTML = highlightCode(godotCode(preset));
}

function play() {
  if (isPlaying) return;
  isPlaying = true;
  playBtn.textContent = '⏸ 播放中...';

  const anim = vfx.animate(presets[preset].keyframes(), {
    duration: duration,
    easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)',
    fill: 'forwards',
  });

  anim.onfinish = () => {
    isPlaying = false;
    playBtn.textContent = '▶ 播放动画 (空格)';
    vfx.style.opacity = '0';
  };
}

document.querySelectorAll('[data-preset]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-preset]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    preset = btn.dataset.preset;
    updateCode();
  });
});

playBtn.addEventListener('click', play);

const dur = document.getElementById('duration');
const off = document.getElementById('offset');
const scl = document.getElementById('scale');
dur.addEventListener('input', () => {
  duration = parseInt(dur.value);
  document.getElementById('dur-val').textContent = (duration / 1000).toFixed(2) + 's';
  updateCode();
});
off.addEventListener('input', () => {
  offset = parseInt(off.value);
  document.getElementById('off-val').textContent = offset + 'px';
  updateCode();
});
scl.addEventListener('input', () => {
  scale = parseInt(scl.value) / 100;
  document.getElementById('scl-val').textContent = scale.toFixed(2);
  updateCode();
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); play(); }
  if (e.key >= '1' && e.key <= '4') {
    const map = ['diagonal', 'fade', 'impact', 'combo'];
    const target = document.querySelector('[data-preset="' + map[parseInt(e.key) - 1] + '"]');
    if (target) target.click();
  }
});

updateCode();
setTimeout(play, 300);
</script>
</body>
</html>
