# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: globalstate_set_absolute
    status: active
    description: "禁止在 GlobalState 上提供 set_stat / set_var / set_affinity 等绝对赋值接口。所有变更必须经 change_*(id, delta)，确保 stat_changed 4 元组 signal 携带正确的 old/new/requested。如需注入完整状态（cheat / 测试），用 from_dict(...) 而非 set_*"
    why: "绝对赋值会绕过 effective_delta 与 requested_delta 的对偶设计，让 UI 在边界场景无法识别真变化。stat-system H.16 AC 验证 has_method('set_stat') == false"
    adr: docs/architecture/adr-0001-stat-system-contract.md
    added: 2026-05-31

  - pattern: globalstate_private_field_write
    status: active
    description: "禁止任何系统绕过 change_* 接口直接写 _stats / _vars / _affinity / _triggered / _era_markers / _chapter 私有字段"
    why: "直接写会跳过 clamp、跳过 _emit_depth 守卫、跳过 signal 广播。下游订阅者会与实际数据状态不一致"
    adr: docs/architecture/adr-0001-stat-system-contract.md
    added: 2026-05-31

  - pattern: reentrant_change_in_signal_handler
    status: active
    description: "禁止在 stat_changed / var_changed / affinity_changed / event_triggered / era_marker_added / chapter_changed 信号 handler 里同步调用 change_* / mark_* / set_chapter。如必须，用 call_deferred 或在订阅时声明 Object.CONNECT_DEFERRED"
    why: "防信号风暴 / 栈溢出。实装侧 _emit_depth 守卫会 push_error 拦下违规，但订阅方不应依赖兜底机制"
    adr: docs/architecture/adr-0001-stat-system-contract.md
    added: 2026-05-31

  - pattern: hardcode_stat_var_affinity_bounds
    status: active
    description: "禁止下游 GDD / 代码 / 测试 hardcode min/max/init 数值（例如禁止 if get_var('xinjie') >= 20）。必须从 STATS_CONFIG[id].max / VARS_CONFIG[id].max / AFFINITY_CONFIG[npc_id].max 读取"
    why: "xinjie/qianbao max=20 等是 PROVISIONAL 数值（终章场景未设计前不冻结），下游 hardcode 会在调整时静默失效。同样适用于 init 值与 min 边界"
    adr: docs/architecture/adr-0001-stat-system-contract.md
    added: 2026-05-31

  - pattern: dialogue_direct_change_stat
    status: active
    description: "禁止 Dialogue 系统直接调 GlobalState.change_stat / change_var / change_affinity。属性变更必须由 Cutscene Runner 执行（Dialogue 节点的 effect 字段委派给 Cutscene Runner）"
    why: "保证 cutscene 是属性变更的行为权威；Dialogue 只负责 condition 查询。两者职责分离，便于 cutscene runner 写 lookup table 与回放"
    adr: docs/architecture/adr-0001-stat-system-contract.md
    added: 2026-05-31

  - pattern: stat_panel_juice_effects
    status: active
    description: "stat-panel-ui 渲染 stat_changed 飘字时，禁止 SFX、彩色变换、缩放/抖动等奖励感特效。必须是单色无音效整数飘字"
    why: "stat-system Player Fantasy 是 acknowledgment fantasy（被看见 / 被记住 / 被允许），juice 反馈会变成奖励感，与 pillar 矛盾"
    adr: docs/architecture/adr-0001-stat-system-contract.md
    added: 2026-05-31

  - pattern: chapter_set_backwards_in_business_code
    status: active
    description: "Cutscene Runner / Dialogue / 任何 gameplay 系统禁止调 set_chapter 让章节回退（如 ch1 → prologue）。章节回退仅允许通过 from_dict 路径"
    why: "防止业务代码意外重置剧情进度。前进方向（prologue → ch1 → ch1_done）是 Event Flow 的正常职责；后退是存档读档语义"
    adr: docs/architecture/adr-0001-stat-system-contract.md
    added: 2026-05-31

  - pattern: affinity_event_without_idempotent_gate
    status: active
    description: "event-flow / npc-system / cutscene-runner / dialogue 在设计任何改 affinity 的事件时，事件实装必须 gate on has_triggered(event_id)：若已触发则跳过该 affinity delta（仅显示对白）"
    why: "防止反复进出小卖部跟鲍师母讲同一段对话刷 affinity 的退化策略。例外：礼物系统等真正可重复事件必须在事件 spec 显式声明 repeatable: true"
    adr: docs/architecture/adr-0001-stat-system-contract.md
    added: 2026-05-31

  - pattern: register_asset_ids_as_autoload
    status: active
    description: "禁止把 asset_ids.gd 注册为 autoload。它是纯 const 资源 ID 表，应通过 preload 引用：const AssetIds = preload('res://scripts/autoload/asset_ids.gd')"
    why: "asset_ids.gd 无 _ready / 无状态 / 无信号；注册成 autoload 浪费 SceneTree slot 且引入 ambiguity。autoload 应保留给有状态/有 _ready/提供信号的单例"
    adr: docs/architecture/adr-0002-autoload-contract.md
    added: 2026-05-31

# Example:
#
# forbidden_patterns:
#   - pattern: autoload_singleton_coupling
