# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: stat_state_absolute_assignment
    status: active
    description: |
      任何 set_stat / set_var / set_affinity 类绝对赋值方法不得添加到 GlobalState。
      所有变更必须经 change_*(id, delta) 接口。
    why: |
      绕过 change_* 会跳过 4 元 signal 的 old_value 与 requested_delta payload，
      让 Stat Panel UI 飘字与实际状态不匹配。任何"绝对赋值"需求必须经 from_dict(...) 注入完整状态。
    adr: docs/architecture/adr-0001-stat-system-contract.md
    enforced_by: "ADR-0001 §H.16 AC（has_method 反射测试）+ PR review"
    added: 2026-06-01

  - pattern: synchronous_change_in_stat_signal_handler
    status: active
    description: |
      在 stat_changed / var_changed / affinity_changed / event_triggered / era_marker_added /
      chapter_changed 信号 handler 内不得同步调用 change_* / mark_* / set_chapter。
      必须用 call_deferred(...) 或订阅时声明 CONNECT_DEFERRED。
    why: |
      会触发 _emit_depth 再入守卫的 push_error 并 return（不修改集合、不发新信号）。
      实装侧守卫只是兜底，订阅 GDD 必须用 CONNECT_DEFERRED 作为预防性"零成本正确"。
    adr: docs/architecture/adr-0001-stat-system-contract.md
    enforced_by: "ADR-0001 §9 实装侧 _emit_depth 守卫 + §F.5 invariant 跨 GDD 声明"
    added: 2026-06-01

  - pattern: unregistered_npc_affinity_change
    status: active
    description: |
      change_affinity(npc_id, delta) 调用前，npc_id 必须已在 AFFINITY_CONFIG 中声明 {init, min, max}。
      未注册 NPC 不允许通过任何路径写入 _affinity（包括 from_dict 也会跳过 + push_warning）。
    why: |
      避免拼写错误 typo 静默累积、避免存档因不规范 NPC ID 持久化污染。
      Demo 范围仅 12 位 NPC（已枚举）；后续章节扩展必须先修订 stat-system GDD §C.4 表 + 本 registry。
    adr: docs/architecture/adr-0001-stat-system-contract.md
    enforced_by: "ADR-0001 §6 AFFINITY_CONFIG schema + ADR-0001 §H.13 / H.17 AC"
    added: 2026-06-01

  - pattern: register_assetids_as_autoload
    status: active
    description: |
      AssetIds (scripts/autoload/asset_ids.gd) 不得注册到 project.godot [autoload]。
      它是 class_name AssetIds extends RefCounted 的静态常量集，
      访问语义是 AssetIds.Char.YUANSHENG（class 级 const），不是 autoload 单例。
    why: |
      文件位于 scripts/autoload/ 目录会让人误以为应注册；但注册后会破坏 class 级 const 访问，
      变成 autoload 节点引用，与现有调用点（12+ 处 AssetIds.Char.X）全部不兼容。
    adr: docs/architecture/adr-0002-autoload-contract.md
    enforced_by: "ADR-0002 §Decision 中显式排除 + Validation Criteria grep 检查"
    added: 2026-06-01

  - pattern: manual_autoload_reorder
    status: active
    description: |
      在 PR 中手动重排 project.godot [autoload] 节顺序属于禁止行为。
      添加 / 删除 / 重排 autoload 必须经新 ADR 修订 ADR-0002，并更新本 registry。
    why: |
      [autoload] 顺序直接决定 _ready 调度顺序；ADR-0001 §10 启动校验、
      §F.5 load-path UI 契约都依赖该顺序成立。私自重排会让上述契约静默失效。
    adr: docs/architecture/adr-0002-autoload-contract.md
    enforced_by: "PR review 扫描 project.godot diff，触及 [autoload] 节必须引用 ADR-0002 修订"
    added: 2026-06-01

