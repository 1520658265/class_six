# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: int_clamp
    status: active
    api: clampi(value, min, max)
    not: clamp(value, min, max)
    adr: docs/architecture/adr-0001-stat-system-contract.md
    reason: "clampi 强制 int 返回类型；clamp 在 from_dict 路径接到 JSON 浮点时会污染返回类型，破坏 Dictionary[String, int] 类型化保证"
    referenced_by:
      - docs/architecture/adr-0001-stat-system-contract.md
    added: 2026-05-31
    revised: ""

  - purpose: typed_dictionary
    status: active
    api: "Dictionary[String, int] / Dictionary[String, bool] / Dictionary[String, Dictionary]"
    not: "Dictionary（无 K/V 类型声明）"
    adr: docs/architecture/adr-0001-stat-system-contract.md
    reason: "Godot 4.4+ typed Dictionary 在 4.6 完全可用（已通过 Web/Context7 文档复核，stat-system §I.4 archive）；下游静态类型访问 GlobalState 字段时受益"
    referenced_by:
      - docs/architecture/adr-0001-stat-system-contract.md
    added: 2026-05-31
    revised: ""

  - purpose: signal_subscription_mode
    status: active
    api: "connect(handler, Object.CONNECT_DEFERRED)"
    not: "connect(handler) 默认同步模式（在订阅 stat/var/affinity/event/era/chapter 信号时禁用）"
    adr: docs/architecture/adr-0001-stat-system-contract.md
    reason: "搭配实装侧 _emit_depth 守卫的双重保险——CONNECT_DEFERRED 把 handler 调度到下一帧，handler 内即使调用 change_* 也已经在新栈帧上运行，不会触发再入"
    referenced_by:
      - docs/architecture/adr-0001-stat-system-contract.md
    added: 2026-05-31
    revised: ""

  - purpose: autoload_load_order
    status: active
    api: "[autoload] 节按声明顺序（top-to-bottom）：GlobalState → Sprites → Portraits → VFX → Atlas → SaveManager → SceneRouter → Dialogue → UIRoot"
    not: "依赖字母序前缀（如 AGlobalState）/ 编辑器 GUI 自动重排"
    adr: docs/architecture/adr-0002-autoload-contract.md
    reason: "Godot 4.x 官方文档（singletons_autoload.md）明确 autoload 按 [autoload] 节声明顺序初始化，与名字字母序无关。GlobalState 必须最前以保证 SaveManager/UIRoot/Dialogue _ready 时它已初始化"
    referenced_by:
      - docs/architecture/adr-0002-autoload-contract.md
      - docs/architecture/adr-0001-stat-system-contract.md
    added: 2026-05-31
    revised: ""

  - purpose: dialogue_script_format
    status: active
    api: "data/dialogue/<chapter_id>.json (自家 JSON 格式)"
    not: "Ink / Yarn / Dialogic 第三方对白引擎"
    adr: docs/architecture/adr-0002-autoload-contract.md
    reason: "Demo 阶段对白量小、条件查询通过 GlobalState 直读即可，引入第三方引擎成本高于收益。已在用户决策中确定（见 memory/project_decision_dialogue_format.md）"
    referenced_by:
      - docs/architecture/adr-0002-autoload-contract.md
    added: 2026-05-31
    revised: ""

