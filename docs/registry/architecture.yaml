# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: integer_clamp_in_state_mutations
    status: active
    api: "clampi(value, min, max)"
    not: "clamp(value, min, max)"
    adr: docs/architecture/adr-0001-stat-system-contract.md
    reason: "from_dict 路径加载 JSON 浮点时，clamp 会污染返回为 float；clampi 强制 int 返回。"
    referenced_by:
      - docs/architecture/adr-0001-stat-system-contract.md
    added: 2026-06-01
    revised: ""

  - purpose: stat_state_dict_typing
    status: active
    api: "Dictionary[String, int]  /  Dictionary[String, bool]"
    not: "untyped Dictionary"
    adr: docs/architecture/adr-0001-stat-system-contract.md
    reason: "Godot 4.4+ 类型化 Dictionary 让 KeyError 在 parse 期暴露，配合 GDScript 静态分析提示。"
    engine_compat: "Godot 4.4+, 4.6 stable"
    referenced_by:
      - docs/architecture/adr-0001-stat-system-contract.md
    added: 2026-06-01
    revised: ""

  - purpose: stat_signal_subscriber_connection
    status: active
    api: "signal.connect(handler, Object.CONNECT_DEFERRED)"
    not: "signal.connect(handler)  /  string-based connect()"
    adr: docs/architecture/adr-0001-stat-system-contract.md
    reason: |
      配合 _emit_depth 再入守卫；handler 内即使同步调用 change_* 也不立即递归，
      由 deferred flag 调度到下一帧 idle。string-based connect 已 deprecated（Godot 4.0）。
    referenced_by:
      - docs/architecture/adr-0001-stat-system-contract.md
    added: 2026-06-01
    revised: ""

  - purpose: project_autoload_registration_order
    status: active
    api: |
      project.godot [autoload] 按声明顺序（top-to-bottom）注册 9 行：
        GlobalState → Sprites → Portraits → Atlas → VFX
        → SaveManager → SceneRouter → Dialogue → UIRoot
    not: |
      字母序 / deferred-load / RefCounted DI；
      AssetIds 不在该节（class_name AssetIds extends RefCounted 静态访问）
    adr: docs/architecture/adr-0002-autoload-contract.md
    reason: |
      Godot 4.x 官方文档：[autoload] 按声明顺序 top-to-bottom 初始化。
      by-feature 顺序确保 GlobalState 在 SaveManager / SceneRouter 之前 _ready，
      从而 ADR-0001 §10 启动 config 校验在最早可能时机 fail-fast。
    engine_compat: "Godot 4.0+ stable; 4.6 verified"
    referenced_by:
      - docs/architecture/adr-0001-stat-system-contract.md
      - docs/architecture/adr-0002-autoload-contract.md
    added: 2026-06-01
    revised: ""

